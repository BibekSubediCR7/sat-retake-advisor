version: 2
updates:
  # Library updates: minor and patch only. Major upgrades (e.g. React 19, Firebase 13)
  # are done deliberately in one tested change. Security updates still arrive separately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
